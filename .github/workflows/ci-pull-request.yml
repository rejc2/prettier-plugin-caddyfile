# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: PR Tests

on:
  pull_request:
    branches: [main]

jobs:
  yaml-schema:
    name: YAML Schema Validation
    uses: ./.github/workflows/test-yaml-schema.yml

  unit-tests:
    name: Unit Tests
    uses: ./.github/workflows/test-unit-tests.yml

  final-lint:
    name: Final Lint
    uses: ./.github/workflows/test-final-lint.yml
